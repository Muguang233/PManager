[package]
name = "PassManager"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
zeroize = "1.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }
